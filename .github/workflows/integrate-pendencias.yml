name: HUUD — Integrar camadas de realidade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrar camadas HUUD
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          markers = [
              '<script src="huud-pendencias.js"></script>',
              '<script src="huud-pendencias-fix.js"></script>',
              '<script src="huud-diagnostico-estruturado.js"></script>',
              '<script src="huud-realidade-v2.js"></script>'
          ]
          needle = '</body>'
          if needle not in text:
              raise SystemExit('Não encontrei </body> no index.html')
          changed = False
          for marker in markers:
              if marker not in text:
                  text = text.replace(needle, marker + '\n' + needle, 1)
                  changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
              print('Camadas HUUD integradas.')
          else:
              print('Camadas já integradas.')
          PY

      - name: Commit da integração
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'HUUD Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate HUUD reality V2'
          git push
